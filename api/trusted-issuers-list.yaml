openapi: 3.0.3
info:
  title: Trusted Issuers List
  description: Maintain a list of trusted issuers of verifiable credentials
  version: 4.0.0
tags:
  - name: verfication
  - name: issuer
paths:
  /issuer:
    get:
      tags:
        - issuer
      operationId: getIssuers
      summary: Get the DIDs of all trusted issuers
      description: >
        Returns a paginated list of DIDs of all trusted issuers. With a scope, only the issuers
        holding credentials granted by exactly that (scope, scopeType) pair are listed, so that a
        reconciliation can compare the grants it expects with the ones that exist. A scope type can
        only be given together with a scope.
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ScopeFilter'
        - $ref: '#/components/parameters/ScopeType'
      responses:
        '200':
          description: Successfully retrieved the list of issuer DIDs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustedIssuersListResponse'
        '400':
          description: >
            The page size is out of range, the scope is blank, the scope type is unknown, or a scope
            type was given without a scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      tags:
        - issuer
      operationId: createTrustedIssuer
      summary: Create a trusted issuer and its credentials
      description: >
        Creates the issuer together with its credentials. When a scope is given, every credential in
        the body is attributed to it and can be revoked through it later - an issuer is usually
        created because something granted it a credential in the first place. Without a scope the
        credentials are managed directly through the issuer endpoints and no revocation will ever
        remove them, so pass the scope whenever the credentials come from a grant. A scope type can
        only be given together with a scope.
      parameters:
        - $ref: '#/components/parameters/OptionalScope'
        - $ref: '#/components/parameters/ScopeType'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrustedIssuer'
      responses:
        '201':
          description: Successfully created the issuer.
        '400':
          description: Invalid issuer provided, an unknown scope type, or a scope type without a scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Issuer with the given did already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /issuer/{did}:
    get:
      tags:
        - issuer
      parameters:
        - $ref: '#/components/parameters/Id'
      description: Get a single issuer
      operationId: getIssuer
      responses:
        '200':
          description: Successfully retrieved the issuer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustedIssuer'
        '404':
          description: No such issuer exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      tags:
        - issuer
      parameters:
        - $ref: '#/components/parameters/Id'
      operationId: deleteIssuerById
      description: >
        Deletes the issuer and every credential it holds, granted ones included. This is the one
        operation that disregards grants, because it removes the subject they were granted to.
      responses:
        '204':
          description: Successfully deleted
        '404':
          description: No such issuer exists.
    put:
      tags:
        - issuer
      parameters:
        - $ref: '#/components/parameters/Id'
      description: >
        Replaces the credentials the issuer is managed with directly. Credentials granted by a scope
        are not touched - they belong to whatever granted them, and only that grant, or the deletion
        of the whole issuer, may remove them.
      operationId: updateIssuer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrustedIssuer'
      responses:
        '200':
          description: Successfully updated the issuer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustedIssuer'
        '404':
          description: No such issuer exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '400':
          description: Invalid issuer provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /issuer/{did}/credential:
    put:
      tags:
        - issuer
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Scope'
        - $ref: '#/components/parameters/ScopeType'
      operationId: replaceCredentialsByScope
      summary: Replace the credentials granted by one scope
      description: >
        Sets the credentials granted by the given scope to exactly the ones provided, leaving the
        credentials of every other scope untouched. The scope is the identifier of whatever granted
        them - a ProductOrder id, for example - so that revoking one grant cannot remove a credential
        another grant still requires. Replacing rather than appending makes the call idempotent, which
        matters because the callers react to notifications that are redelivered on failure. The issuer
        is created if it does not exist yet. Credentials created through the issuer endpoints carry no
        scope and are never touched by this operation. A grant is identified by scope and scope type
        together, so grants of the same scope but another type are left untouched as well.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: Successfully replaced the credentials of the scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustedIssuer'
        '400':
          description: No scope provided, or an unknown scope type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      tags:
        - issuer
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Scope'
        - $ref: '#/components/parameters/ScopeType'
        - $ref: '#/components/parameters/Unscoped'
      operationId: deleteCredentialsByScope
      summary: Delete the credentials granted by one scope
      description: >
        Removes the credentials granted by the given scope and scope type and nothing else. The issuer
        itself is kept, even when no credential remains, so that an issuer somebody else manages is not
        deleted as a side effect. With unscoped=true instead of a scope, only the credentials managed
        directly through the issuer endpoints are removed, and every grant is kept.
      responses:
        '204':
          description: Successfully deleted the credentials of the scope.
        '400':
          description: >
            No scope and no unscoped=true, both of them, a scope type with unscoped=true, or an
            unknown scope type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No such issuer exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /issuer/{did}/scopes:
    get:
      tags:
        - issuer
      parameters:
        - $ref: '#/components/parameters/Id'
      operationId: getIssuerScopes
      summary: List the grants an issuer holds credentials under
      description: >
        Lists every distinct (scope, scope type) pair the issuer holds credentials under, with the
        number of credentials each one granted, sorted by scope and then type, untyped first. This
        lets a caller tell whether something already granted the issuer its credentials without
        reading them. Credentials managed directly through the issuer endpoints carry no scope and
        are not listed, so an issuer that only holds those returns an empty list. The list is not
        paginated, because an issuer holds few grants.
      responses:
        '200':
          description: Successfully retrieved the grants of the issuer.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IssuerScope'
        '404':
          description: No such issuer exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

components:
  parameters:
    Id:
      name: did
      in: path
      required: true
      schema:
        type: string
        example: did:elsi:happypets
    OptionalScope:
      name: scope
      in: query
      required: false
      description: >
        Identifies what granted the credentials, so that they can be revoked without affecting
        credentials granted by anything else. When omitted, the credentials are managed directly
        through the issuer endpoints and no grant can revoke them. Not part of the credential itself
        and never exposed through the trusted-issuers-registry.
      schema:
        type: string
        example: urn:ngsi-ld:product-order:5f7a1e60
    Scope:
      name: scope
      in: query
      required: false
      description: >
        Identifies what granted the credentials, so that they can be revoked without affecting
        credentials granted by anything else. Required, except for a delete with unscoped=true,
        which must not carry one. Not part of the credential itself and never exposed through the
        trusted-issuers-registry.
      schema:
        type: string
        example: urn:ngsi-ld:product-order:5f7a1e60
    ScopeFilter:
      name: scope
      in: query
      required: false
      description: >
        Lists only the issuers holding credentials granted by this scope. When omitted, every issuer
        is listed. Not part of the credential itself and never exposed through the
        trusted-issuers-registry.
      schema:
        type: string
        example: urn:ngsi-ld:product-order:5f7a1e60
    ScopeType:
      name: scopeType
      in: query
      required: false
      description: >
        The kind of thing the scope identifies, e.g. a data-space membership rather than a
        ProductOrder. A grant is identified by scope and scope type together. When omitted, only
        untyped grants are addressed, never grants of any type. Requires a scope. Not part of the
        credential itself and never exposed through the trusted-issuers-registry.
      schema:
        $ref: '#/components/schemas/ScopeType'
    Unscoped:
      name: unscoped
      in: query
      required: false
      description: >
        Addresses the credentials that carry no scope, i.e. the ones managed through the issuer
        endpoints. It is an explicit marker so that a forgotten scope is rejected instead of deleting
        them. Must not be combined with scope or scopeType. Intended for migrating directly managed
        entries into grants.
      schema:
        type: boolean
        example: true
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Maximum number of items to return per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
        example: 10
    Page:
      name: page
      in: query
      required: false
      description: The page number to retrieve (zero-based).
      schema:
        type: integer
        minimum: 0
        default: 0
        example: 0
  schemas:
    ScopeType:
      type: string
      description: >
        The kind of thing a scope identifies. Untyped grants, such as the ProductOrder grants that
        existed before types did, carry no type at all.
      enum:
        - dataspace-membership
      example: dataspace-membership
    IssuerScope:
      type: object
      description: >
        One grant an issuer holds credentials under. Internal to the management API and never
        exposed through the trusted-issuers-registry.
      required:
        - scope
        - credentialCount
      properties:
        scope:
          type: string
          description: Identifies what granted the credentials.
          example: urn:ngsi-ld:product-order:5f7a1e60
        scopeType:
          # nullable, or the generator initialises it to an (impossible) enum instance
          nullable: true
          description: The kind of thing the scope identifies, absent for an untyped grant.
          allOf:
            - $ref: '#/components/schemas/ScopeType'
        credentialCount:
          type: integer
          minimum: 1
          description: Number of credentials the issuer holds under this grant.
          example: 2
    TrustedIssuersListResponse:
      type: object
      properties:
        total:
          type: integer
          description: Total number of trusted issuers.
          example: 42
        pageSize:
          type: integer
          description: Number of items per page.
          example: 10
        page:
          type: integer
          description: Current page number (zero-based).
          example: 0
        items:
          type: array
          description: List of issuer DIDs on this page.
          items:
            type: string
            example: did:elsi:happypets
    TimeRange:
      type: object
      properties:
        from:
          type: string
          format: date-time
          example: '2017-07-21T17:32:28Z'
        to:
          type: string
          format: date-time
          example: '2023-07-21T17:32:28Z'
    Credentials:
      type: object
      properties:
        validFor:
          $ref: '#/components/schemas/TimeRange'
        credentialsType:
          type: string
          example: "CustomerCredential"
        claims:
          type: array
          items:
            $ref: '#/components/schemas/Claim'
    TrustedIssuer:
      type: object
      properties:
        did:
          type: string
          example: did:elsi:happypets
        credentials:
          type: array
          items:
            $ref: '#/components/schemas/Credentials'
    Claim:
      type: object
      properties:
        name:
          type: string
          example: roles
        path:
          type: string
          description: json path to the restricted claim
          example: "$.roles[*].names[*]"
        allowedValues:
          type: array
          items:
            type: object
          example:
            - true
            - 12
            - "GOLD_CUSTOMER"
            - "STANDARD_CUSTOMER"
    ProblemDetails:
      type: object
      properties:
        type:
          description: An absolute URI that identifies the problem type. When dereferenced, it SHOULD provide human-readable documentation for the problem type.
          type: string
          format: uri
          ##default: about:blank
        title:
          description: A short summary of the problem type.
          type: string
          example: Internal Server Error
        status:
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
          type: integer
          example: 500
        detail:
          description: A human readable explanation specific to this occurrence of the problem.
          type: string
          example: Connection timeout
        instance:
          description: An absolute URI that identifies the specific occurrence of the problem. It may or may not yield further information if dereferenced.
          type: string
          format: uri
