micronaut:
  application:
    name: ${project.artifactId}

  server:
    port: 8080
    ssl:
      enabled: false
    forward-headers:
      protocol-header: X-Forwarded-Proto
      port-header: X-Forwarded-Port
      host-header: X-Forwarded-Host
      prefix-header: X-Forwarded-Prefix
    netty:
      # one line per request: remote host, request line, status and duration
      access-logger:
        enabled: ${LOG_REQUESTS:true}
        logger-name: HTTP_ACCESS_LOGGER
        log-format: '%h "%r" %s %Dms'
        # regular expressions of the request uris that are not logged, e.g. probes
        exclusions: ${LOG_REQUESTS_EXCLUSIONS:/health.*,/metrics.*}

  metrics:
    enabled: true
    export:
      prometheus:
        step: PT2s
        descriptions: false

---

datasources:
  default:
    url: jdbc:mysql://localhost:3306/db
    driverClassName: com.mysql.cj.jdbc.Driver
    username: user
    password: password
    dialect: MYSQL

