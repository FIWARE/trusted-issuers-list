micronaut:
  server:
    port: -1
    host: localhost
    ssl:
      enabled: false
  metrics:
    enabled: true
    export:
      prometheus:
        step: PT2s
        descriptions: false

---

datasources:
  default:
    url: jdbc:h2:mem:devDb;LOCK_TIMEOUT=10000;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: user
    password: password
    dialect: H2

liquibase:
  datasources:
    default:
      enabled: true
      change-log: classpath:db/migration/changelog.xml